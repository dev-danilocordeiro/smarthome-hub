[project]
name = "smarthome-simulator"
version = "0.1.0"
description = "Simulates homes and devices speaking the device protocol over MQTT. Never imports the hub."
requires-python = ">=3.12,<3.15"
dependencies = [
  "device-protocol",
  "aiomqtt (>=2.5.1,<3.0.0)",
  "httpx (>=0.28.1,<0.29.0)",
  # Only the device side of a command's trace; exported when OTEL_EXPORTER_OTLP_ENDPOINT is set.
  "opentelemetry-api (>=1.45.0,<2.0.0)",
  "opentelemetry-sdk (>=1.45.0,<2.0.0)",
  "opentelemetry-exporter-otlp-proto-grpc (>=1.45.0,<2.0.0)",
]

[project.scripts]
smarthome-simulator = "smarthome_simulator.__main__:main"

[tool.poetry]
packages = [{ include = "smarthome_simulator", from = "src" }]

[tool.poetry.dependencies]
device-protocol = { path = "../../packages/device-protocol", develop = true }

[tool.poetry.group.dev.dependencies]
ruff = ">=0.8"
mypy = ">=1.13"
pytest = "^9.1.1"
hypothesis = "^6.168.3"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
extend = "../../ruff.toml"

[tool.ruff.lint.extend-per-file-ignores]
# Behaviour models are made of domain constants (hours of the day, probabilities, wattages);
# naming every one of them would make the model harder to read, not easier.
"src/smarthome_simulator/{devices,environment}.py" = ["PLR2004", "PLR0915"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests"]
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]
