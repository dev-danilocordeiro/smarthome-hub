# Mosquitto for the smart home hub. See docs/adr/0005-mqtt-broker-and-qos.md.
#
# TLS only: there is no plaintext listener, not even on localhost.
listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2

# Every client is a dynamic-security client with its own credentials and role.
# Devices get a role that only covers their own topics (created at provisioning).
allow_anonymous false
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

# Persist sessions and retained messages (presence, reported state) across restarts.
persistence true
persistence_location /mosquitto/data/
autosave_interval 30

# Bound what a single (possibly compromised) device can make the broker hold.
max_packet_size 65536
max_inflight_messages 20
max_queued_messages 1000
max_keepalive 300

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp_format %Y-%m-%dT%H:%M:%S
connection_messages true
