global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Application metrics arrive pushed over OTLP (--web.enable-otlp-receiver).
# Resource attributes promoted to labels so dashboards can filter by them.
otlp:
  promote_resource_attributes:
    - service.name
    - service.namespace
    - service.version
    - service.instance.id
    - deployment.environment.name

rule_files:
  - /etc/prometheus/rules/smarthome.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

storage:
  tsdb:
    # OTLP pushes from several processes can land slightly out of order.
    out_of_order_time_window: 5m
  exemplars:
    max_exemplars: 100000

# Infrastructure components still expose /metrics and are scraped.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: ["keycloak:9000"]
