# Mirrors the CI gates that are cheap enough to run on every commit.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: apps/api/.venv/bin/ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: apps/api/.venv/bin/ruff check --fix
        language: system
        types: [python]
      - id: import-contracts
        name: import-linter
        entry: make -s lint-imports
        language: system
        pass_filenames: false
        files: ^apps/api/src/
